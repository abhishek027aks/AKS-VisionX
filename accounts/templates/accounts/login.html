<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VyapaarX</title>
</head>
<body>

    <h1>VyapaarX</h1>

    <h2>Login</h2>

    {% if form.errors %}
        <p>Username or password is incorrect.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Login
        </button>
    </form>

    <p>
        <a href="{% url 'accounts:password_reset' %}">
            Forgot Password?
        </a>
    </p>

    <p>
        Don't have an account?
        <a href="{% url 'accounts:register' %}">
            Create Account
        </a>
    </p>

</body>
</html>
