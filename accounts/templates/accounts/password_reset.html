<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - VyapaarX</title>
</head>
<body>

    <h1>VyapaarX</h1>

    <h2>Forgot Password?</h2>

    <p>
        Enter your registered email address.
        We will generate a password reset link.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Send Reset Link
        </button>
    </form>

    <p>
        <a href="{% url 'accounts:login' %}">
            Back to Login
        </a>
    </p>

</body>
</html>
