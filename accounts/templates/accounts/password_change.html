<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Change Password - VyapaarX</title>
</head>
<body>

    <h1>VyapaarX</h1>
    <h2>Change Password</h2>

    <p>
        Enter your current password and choose a new password.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Change Password
        </button>
    </form>

    <p>
        <a href="{% url 'accounts:security' %}">
            Back to Security
        </a>
    </p>

</body>
</html>
